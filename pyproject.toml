[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear, C4 = flake8-comprehensions
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # linha muito longa — ruff format cuida
    "B008",   # não chamar funções em default args (conflita com CustomTkinter)
]

[tool.ruff.lint.isort]
known-first-party = ["automation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
